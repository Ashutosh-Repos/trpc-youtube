version: "3.8"

services:
    # -----------------------------------------------------
    # 1. MinIO (S3 Compatible Storage)
    # -----------------------------------------------------
    minio:
        image: minio/minio
        container_name: youtube_minio
        ports:
            - "9000:9000" # API
            - "9001:9001" # Console
        environment:
            MINIO_ROOT_USER: minioadmin
            MINIO_ROOT_PASSWORD: minioadmin
        command: server /data --console-address ":9001"
        volumes:
            - minio_data:/data
        networks:
            - youtube_network
        depends_on:
            - redis

    # -----------------------------------------------------
    # 2. Redis (Queue, Cache, Events)
    # -----------------------------------------------------
    redis:
        image: redis:alpine
        container_name: youtube_redis
        ports:
            - "6379:6379"
        command: redis-server --appendonly yes
        volumes:
            - redis_data:/data
        networks:
            - youtube_network

    # -----------------------------------------------------
    # 3. Create Default Bucket (One-off initialization)
    # -----------------------------------------------------
    createbuckets:
        image: minio/mc
        container_name: youtube_createbuckets
        depends_on:
            - minio
            - redis
        entrypoint: >
            /bin/sh -c "
            echo 'Waiting for MinIO...';
            until (mc alias set minio http://minio:9000 minioadmin minioadmin); do echo '...waiting...'; sleep 1; done;

            echo 'Creating bucket: youtube-videos';
            mc mb minio/youtube-videos --ignore-existing;
            # Intentionally leaving bucket private to emulate Railway storage behavior

            echo 'Adding Lifecycle Policy: Abort Incomplete Multipart Uploads (2 days)';
            mc ilm add --abort-incomplete --expiry-days 2 minio/youtube-videos;

            echo '✅ MinIO Private Bucket & Lifecycle Configured!';
            exit 0;
            "
        networks:
            - youtube_network

# -----------------------------------------------------
# Volumes & Networks
# -----------------------------------------------------
volumes:
    minio_data:
    redis_data:

networks:
    youtube_network:
        driver: bridge
