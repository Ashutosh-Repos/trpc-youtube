version: "3.8"

services:
    # -----------------------------------------------------
    # 1. MinIO (S3 Compatible Storage)
    # -----------------------------------------------------
    minio:
        image: minio/minio
        container_name: youtube_minio
        ports:
            - "9000:9000" # API
            - "9001:9001" # Console
        environment:
            MINIO_ROOT_USER: minioadmin
            MINIO_ROOT_PASSWORD: minioadmin
            # Configure MinIO to send bucket events to Redis
            # 'primary' is the target ID we use in 'mc event add'
            MINIO_NOTIFY_REDIS_ENABLE_primary: "on"
            MINIO_NOTIFY_REDIS_ADDRESS_primary: "redis:6379"
            MINIO_NOTIFY_REDIS_KEY_primary: "minio_events"
            MINIO_NOTIFY_REDIS_FORMAT_primary: "access"
        command: server /data --console-address ":9001"
        volumes:
            - minio_data:/data
        networks:
            - youtube_network
        depends_on:
            - redis

    # -----------------------------------------------------
    # 2. Redis (Queue, Cache, Events)
    # -----------------------------------------------------
    redis:
        image: redis:alpine
        container_name: youtube_redis
        ports:
            - "6379:6379"
        command: redis-server --appendonly yes
        volumes:
            - redis_data:/data
        networks:
            - youtube_network

    # -----------------------------------------------------
    # 3. Create Default Bucket (One-off initialization)
    # -----------------------------------------------------
    createbuckets:
        image: minio/mc
        container_name: youtube_createbuckets
        depends_on:
            - minio
            - redis
        entrypoint: >
            /bin/sh -c "
            echo 'Waiting for MinIO...';
            until (mc alias set minio http://minio:9000 minioadmin minioadmin); do echo '...waiting...'; sleep 1; done;

            echo 'Creating bucket: youtube-videos';
            mc mb minio/youtube-videos --ignore-existing;
            mc anonymous set public minio/youtube-videos;

            echo 'Configuring Event Notification -> Redis';
            echo '...Waiting 10s for MinIO/Redis connection...';
            sleep 10;

            # Add event notification for PUT events (uploads) to Redis
            # arn:minio:sqs::{REGION}:{TARGET_ID} -> arn:minio:sqs::primary:redis
            until mc event add minio/youtube-videos arn:minio:sqs::primary:redis --event put --prefix raw-videos/; do echo '...retrying event add...'; sleep 2; done;

            echo 'Event Listeners:';
            mc event list minio/youtube-videos;

            echo 'Adding Lifecycle Policy: Abort Incomplete Multipart Uploads (2 days)';
            mc ilm add --abort-incomplete --expiry-days 2 minio/youtube-videos;

            echo '✅ MinIO Bucket, Events & Lifecycle Configured!';
            exit 0;
            "
        networks:
            - youtube_network

# -----------------------------------------------------
# Volumes & Networks
# -----------------------------------------------------
volumes:
    minio_data:
    redis_data:

networks:
    youtube_network:
        driver: bridge
